name: rentacar-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: luxride
      POSTGRES_USER: luxride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxride -d luxride"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    image: ${API_IMAGE:?API_IMAGE is required}
    pull_policy: always
    env_file:
      - ${BACKEND_ENV_FILE:-/opt/rentacar/config/backend.env}
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://luxride:${POSTGRES_PASSWORD}@db:5432/luxride
      RUN_BACKGROUND_JOBS: "false"
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  worker:
    image: ${API_IMAGE:?API_IMAGE is required}
    pull_policy: always
    command: ["node", "src/worker.js"]
    env_file:
      - ${BACKEND_ENV_FILE:-/opt/rentacar/config/backend.env}
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://luxride:${POSTGRES_PASSWORD}@db:5432/luxride
      RUN_BACKGROUND_JOBS: "true"
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  customer:
    image: ${CUSTOMER_IMAGE:?CUSTOMER_IMAGE is required}
    pull_policy: always
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped

  admin:
    image: ${ADMIN_IMAGE:?ADMIN_IMAGE is required}
    pull_policy: always
    ports:
      - "127.0.0.1:8082:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      PROMETHEUS_CONFIG: /etc/prometheus/prometheus.prod.yml
    volumes:
      - ./monitoring/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.prod.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - prometheus_data:/prometheus
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    command:
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    depends_on:
      backend:
        condition: service_healthy
      worker:
        condition: service_healthy
      alertmanager:
        condition: service_started
    mem_limit: 384m
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "127.0.0.1:9093:9093"
    env_file:
      - ${ALERTMANAGER_ENV_FILE:-/opt/rentacar/config/alertmanager.env}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/alertmanager.yml.tpl:/etc/alertmanager/alertmanager.yml.tpl:ro
      - ./monitoring/alertmanager/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    mem_limit: 128m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-monitor.rent-a-car-brns.org}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:-monitor.rent-a-car-brns.org}/
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - alertmanager
    mem_limit: 256m
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
