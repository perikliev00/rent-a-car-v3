name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA image tag to deploy
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  ECR_API_REPOSITORY: rentacar-api
  ECR_CUSTOMER_REPOSITORY: rentacar-customer
  ECR_ADMIN_REPOSITORY: rentacar-admin

jobs:
  release-gate:
    name: Verify production artifacts
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      )

    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      api_digest: ${{ steps.verify.outputs.api_digest }}
      customer_digest: ${{ steps.verify.outputs.customer_digest }}
      admin_digest: ${{ steps.verify.outputs.admin_digest }}
      api_image: ${{ steps.verify.outputs.api_image }}
      customer_image: ${{ steps.verify.outputs.customer_image }}
      admin_image: ${{ steps.verify.outputs.admin_image }}

    steps:
      - name: Resolve immutable image tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="${{ github.event.workflow_run.head_sha }}"
          fi

          if [ -z "$TAG" ]; then
            echo "Missing commit SHA"
            exit 1
          fi

          if ! echo "$TAG" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Image tag must be a full 40-character Git commit SHA"
            exit 1
          fi

          echo "Resolved immutable release SHA:"
          echo "$TAG"

          # Manual deployments must also reference a commit that had
          # a successful CI run on main.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Verifying successful CI for $TAG..."

            SUCCESS_COUNT="$(
              gh api \
                "repos/${{ github.repository }}/actions/runs?head_sha=${TAG}&per_page=50" \
                --jq '[.workflow_runs[] |
                  select(
                    .name == "CI" and
                    .conclusion == "success" and
                    .head_branch == "main"
                  )
                ] | length'
            )"

            if [ "${SUCCESS_COUNT:-0}" -lt 1 ]; then
              echo "No successful CI run on main for $TAG"
              exit 1
            fi

            echo "Successful CI confirmed."
          fi

          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify immutable ECR images
        id: verify
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.resolve.outputs.image_tag }}
        run: |
          set -euo pipefail

          API_IMAGE="$ECR_REGISTRY/$ECR_API_REPOSITORY:$TAG"
          CUSTOMER_IMAGE="$ECR_REGISTRY/$ECR_CUSTOMER_REPOSITORY:$TAG"
          ADMIN_IMAGE="$ECR_REGISTRY/$ECR_ADMIN_REPOSITORY:$TAG"

          echo "Verifying release images:"
          echo "  $API_IMAGE"
          echo "  $CUSTOMER_IMAGE"
          echo "  $ADMIN_IMAGE"

          docker pull "$API_IMAGE"
          docker pull "$CUSTOMER_IMAGE"
          docker pull "$ADMIN_IMAGE"

          API_DIGEST="$(
            aws ecr batch-get-image \
              --repository-name "$ECR_API_REPOSITORY" \
              --image-ids imageTag="$TAG" \
              --query 'images[0].imageId.imageDigest' \
              --output text
          )"

          CUSTOMER_DIGEST="$(
            aws ecr batch-get-image \
              --repository-name "$ECR_CUSTOMER_REPOSITORY" \
              --image-ids imageTag="$TAG" \
              --query 'images[0].imageId.imageDigest' \
              --output text
          )"

          ADMIN_DIGEST="$(
            aws ecr batch-get-image \
              --repository-name "$ECR_ADMIN_REPOSITORY" \
              --image-ids imageTag="$TAG" \
              --query 'images[0].imageId.imageDigest' \
              --output text
          )"

          if [ -z "$API_DIGEST" ] || [ "$API_DIGEST" = "None" ]; then
            echo "API digest not found"
            exit 1
          fi

          if [ -z "$CUSTOMER_DIGEST" ] || [ "$CUSTOMER_DIGEST" = "None" ]; then
            echo "Customer digest not found"
            exit 1
          fi

          if [ -z "$ADMIN_DIGEST" ] || [ "$ADMIN_DIGEST" = "None" ]; then
            echo "Admin digest not found"
            exit 1
          fi

          API_REF="$ECR_REGISTRY/$ECR_API_REPOSITORY@$API_DIGEST"
          CUSTOMER_REF="$ECR_REGISTRY/$ECR_CUSTOMER_REPOSITORY@$CUSTOMER_DIGEST"
          ADMIN_REF="$ECR_REGISTRY/$ECR_ADMIN_REPOSITORY@$ADMIN_DIGEST"

          echo "Verified immutable digests:"
          echo "  API:      $API_REF"
          echo "  Customer: $CUSTOMER_REF"
          echo "  Admin:    $ADMIN_REF"

          echo "api_digest=$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "customer_digest=$CUSTOMER_DIGEST" >> "$GITHUB_OUTPUT"
          echo "admin_digest=$ADMIN_DIGEST" >> "$GITHUB_OUTPUT"

          echo "api_image=$API_REF" >> "$GITHUB_OUTPUT"
          echo "customer_image=$CUSTOMER_REF" >> "$GITHUB_OUTPUT"
          echo "admin_image=$ADMIN_REF" >> "$GITHUB_OUTPUT"

          {
            echo "image_tag=$TAG"
            echo "api_image=$API_REF"
            echo "customer_image=$CUSTOMER_REF"
            echo "admin_image=$ADMIN_REF"
          } > verified-release.txt

      - name: Upload verified release manifest
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-${{ steps.resolve.outputs.image_tag }}
          path: verified-release.txt
          if-no-files-found: error
          retention-days: 30

      - name: Release gate passed
        run: |
          echo "Release artifacts verified successfully."
          echo "Ready for Lightsail deployment transport."