name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA image tag to deploy
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  ECR_API_REPOSITORY: rentacar-api
  ECR_CUSTOMER_REPOSITORY: rentacar-customer
  ECR_ADMIN_REPOSITORY: rentacar-admin

jobs:
  release-gate:
    name: Verify production artifacts
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      )

    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      api_digest: ${{ steps.verify.outputs.api_digest }}
      customer_digest: ${{ steps.verify.outputs.customer_digest }}
      admin_digest: ${{ steps.verify.outputs.admin_digest }}
      api_image: ${{ steps.verify.outputs.api_image }}
      customer_image: ${{ steps.verify.outputs.customer_image }}
      admin_image: ${{ steps.verify.outputs.admin_image }}

    steps:
      - name: Resolve immutable image tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="${{ github.event.workflow_run.head_sha }}"
          fi

          if [ -z "$TAG" ]; then
            echo "Missing commit SHA"
            exit 1
          fi

          if ! echo "$TAG" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Image tag must be a full 40-character Git commit SHA"
            exit 1
          fi

          echo "Resolved immutable release SHA:"
          echo "$TAG"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Verifying successful CI for $TAG..."

            SUCCESS_COUNT="$(
              gh api \
                "repos/${{ github.repository }}/actions/runs?head_sha=${TAG}&per_page=50" \
                --jq '[.workflow_runs[] |
                  select(
                    .name == "CI" and
                    .conclusion == "success" and
                    .head_branch == "main"
                  )
                ] | length'
            )"

            if [ "${SUCCESS_COUNT:-0}" -lt 1 ]; then
              echo "No successful CI run on main for $TAG"
              exit 1
            fi

            echo "Successful CI confirmed."
          fi

          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify immutable ECR images
        id: verify
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.resolve.outputs.image_tag }}
        run: |
          set -euo pipefail

          API_IMAGE="$ECR_REGISTRY/$ECR_API_REPOSITORY:$TAG"
          CUSTOMER_IMAGE="$ECR_REGISTRY/$ECR_CUSTOMER_REPOSITORY:$TAG"
          ADMIN_IMAGE="$ECR_REGISTRY/$ECR_ADMIN_REPOSITORY:$TAG"

          echo "Verifying release images:"
          echo "  $API_IMAGE"
          echo "  $CUSTOMER_IMAGE"
          echo "  $ADMIN_IMAGE"

          docker pull "$API_IMAGE"
          docker pull "$CUSTOMER_IMAGE"
          docker pull "$ADMIN_IMAGE"

          API_DIGEST="$(
            aws ecr batch-get-image \
              --repository-name "$ECR_API_REPOSITORY" \
              --image-ids imageTag="$TAG" \
              --query 'images[0].imageId.imageDigest' \
              --output text
          )"

          CUSTOMER_DIGEST="$(
            aws ecr batch-get-image \
              --repository-name "$ECR_CUSTOMER_REPOSITORY" \
              --image-ids imageTag="$TAG" \
              --query 'images[0].imageId.imageDigest' \
              --output text
          )"

          ADMIN_DIGEST="$(
            aws ecr batch-get-image \
              --repository-name "$ECR_ADMIN_REPOSITORY" \
              --image-ids imageTag="$TAG" \
              --query 'images[0].imageId.imageDigest' \
              --output text
          )"

          if [ -z "$API_DIGEST" ] || [ "$API_DIGEST" = "None" ]; then
            echo "API digest not found"
            exit 1
          fi

          if [ -z "$CUSTOMER_DIGEST" ] || [ "$CUSTOMER_DIGEST" = "None" ]; then
            echo "Customer digest not found"
            exit 1
          fi

          if [ -z "$ADMIN_DIGEST" ] || [ "$ADMIN_DIGEST" = "None" ]; then
            echo "Admin digest not found"
            exit 1
          fi

          API_REF="$ECR_REGISTRY/$ECR_API_REPOSITORY@$API_DIGEST"
          CUSTOMER_REF="$ECR_REGISTRY/$ECR_CUSTOMER_REPOSITORY@$CUSTOMER_DIGEST"
          ADMIN_REF="$ECR_REGISTRY/$ECR_ADMIN_REPOSITORY@$ADMIN_DIGEST"

          echo "Verified immutable digests:"
          echo "  API:      $API_REF"
          echo "  Customer: $CUSTOMER_REF"
          echo "  Admin:    $ADMIN_REF"

          echo "api_digest=$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "customer_digest=$CUSTOMER_DIGEST" >> "$GITHUB_OUTPUT"
          echo "admin_digest=$ADMIN_DIGEST" >> "$GITHUB_OUTPUT"

          echo "api_image=$API_REF" >> "$GITHUB_OUTPUT"
          echo "customer_image=$CUSTOMER_REF" >> "$GITHUB_OUTPUT"
          echo "admin_image=$ADMIN_REF" >> "$GITHUB_OUTPUT"

          {
            echo "image_tag=$TAG"
            echo "api_image=$API_REF"
            echo "customer_image=$CUSTOMER_REF"
            echo "admin_image=$ADMIN_REF"
          } > verified-release.txt

      - name: Upload verified release manifest
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-${{ steps.resolve.outputs.image_tag }}
          path: verified-release.txt
          if-no-files-found: error
          retention-days: 30

      - name: Release gate passed
        run: |
          echo "Release artifacts verified successfully."

  deploy-production:
    name: Deploy to Lightsail
    needs: release-gate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: rentacar-production
      cancel-in-progress: false

    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-gate.outputs.image_tag }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate Lightsail SSH configuration
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_SSH_PRIVATE_KEY_B64: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY_B64 }}
          LIGHTSAIL_SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          for name in LIGHTSAIL_HOST LIGHTSAIL_USER LIGHTSAIL_SSH_PRIVATE_KEY_B64 LIGHTSAIL_SSH_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Configure SSH
        env:
          LIGHTSAIL_SSH_PRIVATE_KEY_B64: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY_B64 }}
          LIGHTSAIL_SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"

          printf '%s' "$LIGHTSAIL_SSH_PRIVATE_KEY_B64" | base64 --decode > "$HOME/.ssh/lightsail_deploy"
          chmod 600 "$HOME/.ssh/lightsail_deploy"

          printf '%s\n' "$LIGHTSAIL_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y -f "$HOME/.ssh/lightsail_deploy" >/dev/null

          echo "SSH private key decoded and validated"

      - name: Build verified release file
        env:
          IMAGE_TAG: ${{ needs.release-gate.outputs.image_tag }}
          API_IMAGE: ${{ needs.release-gate.outputs.api_image }}
          CUSTOMER_IMAGE: ${{ needs.release-gate.outputs.customer_image }}
          ADMIN_IMAGE: ${{ needs.release-gate.outputs.admin_image }}
        run: |
          set -euo pipefail

          {
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "API_IMAGE=$API_IMAGE"
            echo "CUSTOMER_IMAGE=$CUSTOMER_IMAGE"
            echo "ADMIN_IMAGE=$ADMIN_IMAGE"
          } > verified-release.env

      - name: Validate deployment payload
        run: |
          set -euo pipefail

          test -f docker-compose.aws.yml
          test -d monitoring/prometheus
          test -d monitoring/alertmanager
          test -d monitoring/grafana/provisioning
          test -f ops/deploy-production.sh

          echo "Versioned deployment payload is present for ${{ needs.release-gate.outputs.image_tag }}"

      - name: Authenticate Lightsail host to ECR
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          API_IMAGE: ${{ needs.release-gate.outputs.api_image }}
        run: |
          set -euo pipefail

          ECR_REGISTRY="${API_IMAGE%%/*}"
          ECR_PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"
          echo "::add-mask::$ECR_PASSWORD"

          printf '%s' "$ECR_PASSWORD" | ssh \
            -i "$HOME/.ssh/lightsail_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "docker login --username AWS --password-stdin '$ECR_REGISTRY' >/dev/null"

      - name: Copy deployment payload
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          IMAGE_TAG: ${{ needs.release-gate.outputs.image_tag }}
        run: |
          set -euo pipefail

          REMOTE_DIR="/tmp/rentacar-deploy-$IMAGE_TAG"

          ssh \
            -i "$HOME/.ssh/lightsail_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "rm -rf '$REMOTE_DIR' && mkdir -m 700 '$REMOTE_DIR'"

          scp \
            -i "$HOME/.ssh/lightsail_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            ops/deploy-production.sh verified-release.env docker-compose.aws.yml \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:$REMOTE_DIR/"

          scp -r \
            -i "$HOME/.ssh/lightsail_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            monitoring \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:$REMOTE_DIR/"

      - name: Deploy verified release
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          IMAGE_TAG: ${{ needs.release-gate.outputs.image_tag }}
        run: |
          set -euo pipefail

          REMOTE_DIR="/tmp/rentacar-deploy-$IMAGE_TAG"

          ssh \
            -i "$HOME/.ssh/lightsail_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "chmod 700 '$REMOTE_DIR/deploy-production.sh' && '$REMOTE_DIR/deploy-production.sh' '$REMOTE_DIR/verified-release.env' '$REMOTE_DIR'"

      - name: Remove remote deployment payload
        if: always()
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          IMAGE_TAG: ${{ needs.release-gate.outputs.image_tag }}
        run: |
          set +e
          REMOTE_DIR="/tmp/rentacar-deploy-$IMAGE_TAG"
          ssh \
            -i "$HOME/.ssh/lightsail_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "rm -rf '$REMOTE_DIR'"
