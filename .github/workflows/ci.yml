name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  AWS_REGION: eu-central-1
  ECR_API_REPOSITORY: rentacar-api
  ECR_CUSTOMER_REPOSITORY: rentacar-customer
  ECR_ADMIN_REPOSITORY: rentacar-admin

jobs:
  backend-lint:
    name: backend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint

  backend-unit:
    name: backend-unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: |
            backend/coverage/coverage-summary.json
            backend/coverage/lcov.info
            backend/coverage/lcov-report
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-jest-results
          path: backend/test-results/jest-results.json
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: front end/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: |
            front end/coverage/coverage-summary.json
            front end/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-unit-vitest-results
          path: front end/test-results/vitest-results.json
          if-no-files-found: error
          retention-days: 14

  frontend-admin:
    name: frontend-admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-front-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin-front-end/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: admin-frontend-unit-coverage
          path: |
            admin-front-end/coverage/coverage-summary.json
            admin-front-end/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-frontend-unit-vitest-results
          path: admin-front-end/test-results/vitest-results.json
          if-no-files-found: error
          retention-days: 14

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            front end/package-lock.json
            admin-front-end/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: |
          npm --prefix backend ci
          npm --prefix "front end" ci
          npm --prefix admin-front-end ci
          npm --prefix e2e ci

      - name: npm audit (high+)
        run: |
          npm --prefix backend audit --audit-level=high
          npm --prefix "front end" audit --audit-level=high
          npm --prefix admin-front-end audit --audit-level=high
          npm --prefix e2e audit --audit-level=high

  migration-test:
    name: migration-test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luxride_migrate
          POSTGRES_USER: luxride
          POSTGRES_PASSWORD: luxride
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luxride -d luxride_migrate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://luxride:luxride@localhost:5432/luxride_migrate

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Apply schema + migrations
        run: npm run db:setup

      - name: Assert all migrations recorded
        run: npm run db:assert-migrations

      - name: Re-run migrate (idempotent no-op)
        run: npm run db:migrate

  db-consistency:
    name: db-consistency
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luxride_test
          POSTGRES_USER: luxride
          POSTGRES_PASSWORD: luxride
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luxride -d luxride_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://luxride:luxride@localhost:5432/luxride_test
      RUN_DB_TESTS: 'true'
      SESSION_SECRET: test-session-secret-32-chars-minimum!!

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run db:setup
      - run: npm run test:db

  integration:
    name: integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luxride_test
          POSTGRES_USER: luxride
          POSTGRES_PASSWORD: luxride
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luxride -d luxride_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://luxride:luxride@localhost:5432/luxride_test
      RUN_INTEGRATION_TESTS: '1'
      STRIPE_STUB: '1'
      EMAIL_ENABLED: 'false'
      STRIPE_SECRET: sk_test_ci_placeholder_key_123456789012
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder_secret
      SESSION_SECRET: test-session-secret-32-chars-minimum!!
      FRONTEND_BASE_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run db:setup
      - run: npm run test:integration

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-jest-results
          path: backend/test-results/jest-integration-results.json
          if-no-files-found: warn
          retention-days: 14

  e2e-playwright:
    name: e2e-playwright
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luxride_test
          POSTGRES_USER: luxride
          POSTGRES_PASSWORD: luxride
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luxride -d luxride_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://luxride:luxride@localhost:5432/luxride_test
      STRIPE_STUB: '1'
      EMAIL_ENABLED: 'false'
      STRIPE_SECRET: sk_test_ci_placeholder_key_123456789012
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder_secret
      SESSION_SECRET: test-session-secret-32-chars-minimum!!
      FRONTEND_BASE_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            front end/package-lock.json
            admin-front-end/package-lock.json
            e2e/package-lock.json

      - name: Setup test database
        working-directory: backend
        run: npm ci && npm run db:setup

      - name: Install app + E2E dependencies
        run: |
          npm --prefix "front end" ci
          npm --prefix admin-front-end ci
          npm --prefix e2e ci
          npm run e2e:install

      - name: Run Playwright E2E tests
        run: npm run e2e

      - name: Fail on Playwright retries (flake signal)
        if: always()
        run: npm run e2e:check-flakes

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-playwright-json
          path: e2e/test-results/results.json
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-playwright-html
          path: e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      api_digest: ${{ steps.push.outputs.api_digest }}
      frontend_digest: ${{ steps.push.outputs.frontend_digest }}
      admin_digest: ${{ steps.push.outputs.admin_digest }}
      pushed: ${{ steps.meta.outputs.push }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag / push policy
        id: meta
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

          # Immutable release artifacts are pushed only from main.
          # Pull requests still build the images, but never push them.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve frontend build args
        id: vite
        run: |
          API_URL="${{ vars.VITE_API_BASE_URL }}"
          ADMIN_URL="${{ vars.VITE_ADMIN_FRONTEND_URL }}"
          CUSTOMER_URL="${{ vars.VITE_CUSTOMER_FRONTEND_URL }}"
          SENTRY_DSN="${{ vars.VITE_SENTRY_DSN }}"
          SENTRY_RATE="${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE }}"

          if [ "${{ steps.meta.outputs.push }}" = "true" ]; then
            if [ -z "$API_URL" ] || [ "$API_URL" = "http://localhost:3000" ]; then
              echo "Set repository variable VITE_API_BASE_URL before pushing release images from main"
              exit 1
            fi
          elif [ -z "$API_URL" ]; then
            API_URL="http://localhost:3000"
          fi

          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "admin_url=$ADMIN_URL" >> "$GITHUB_OUTPUT"
          echo "customer_url=$CUSTOMER_URL" >> "$GITHUB_OUTPUT"
          echo "sentry_dsn=$SENTRY_DSN" >> "$GITHUB_OUTPUT"
          echo "sentry_rate=${SENTRY_RATE:-0.1}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: steps.meta.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: steps.meta.outputs.push == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: |
          docker build \
            -t "rentacar-api:${{ steps.meta.outputs.tag }}" \
            ./backend

      - name: Build customer frontend image
        run: >
          docker build
          --build-arg VITE_API_BASE_URL=${{ steps.vite.outputs.api_url }}
          --build-arg VITE_ADMIN_FRONTEND_URL=${{ steps.vite.outputs.admin_url }}
          --build-arg VITE_SENTRY_DSN=${{ steps.vite.outputs.sentry_dsn }}
          --build-arg VITE_SENTRY_TRACES_SAMPLE_RATE=${{ steps.vite.outputs.sentry_rate }}
          -t "rentacar-customer:${{ steps.meta.outputs.tag }}"
          "./front end"

      - name: Build admin frontend image
        run: >
          docker build
          --build-arg VITE_API_BASE_URL=${{ steps.vite.outputs.api_url }}
          --build-arg VITE_CUSTOMER_FRONTEND_URL=${{ steps.vite.outputs.customer_url }}
          --build-arg VITE_SENTRY_DSN=${{ steps.vite.outputs.sentry_dsn }}
          --build-arg VITE_SENTRY_TRACES_SAMPLE_RATE=${{ steps.vite.outputs.sentry_rate }}
          -t "rentacar-admin:${{ steps.meta.outputs.tag }}"
          ./admin-front-end

      - name: Push immutable SHA images to ECR
        id: push
        if: steps.meta.outputs.push == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          TAG="${{ steps.meta.outputs.tag }}"

          API_IMAGE="$ECR_REGISTRY/$ECR_API_REPOSITORY:$TAG"
          CUSTOMER_IMAGE="$ECR_REGISTRY/$ECR_CUSTOMER_REPOSITORY:$TAG"
          ADMIN_IMAGE="$ECR_REGISTRY/$ECR_ADMIN_REPOSITORY:$TAG"

          echo "Publishing immutable images:"
          echo "  $API_IMAGE"
          echo "  $CUSTOMER_IMAGE"
          echo "  $ADMIN_IMAGE"

          docker tag "rentacar-api:$TAG" "$API_IMAGE"
          docker tag "rentacar-customer:$TAG" "$CUSTOMER_IMAGE"
          docker tag "rentacar-admin:$TAG" "$ADMIN_IMAGE"

          docker push "$API_IMAGE"
          docker push "$CUSTOMER_IMAGE"
          docker push "$ADMIN_IMAGE"

          API_DIGEST="$(aws ecr batch-get-image \
            --repository-name "$ECR_API_REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --query 'images[0].imageId.imageDigest' \
            --output text)"

          CUSTOMER_DIGEST="$(aws ecr batch-get-image \
            --repository-name "$ECR_CUSTOMER_REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --query 'images[0].imageId.imageDigest' \
            --output text)"

          ADMIN_DIGEST="$(aws ecr batch-get-image \
            --repository-name "$ECR_ADMIN_REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --query 'images[0].imageId.imageDigest' \
            --output text)"

          test -n "$API_DIGEST"
          test -n "$CUSTOMER_DIGEST"
          test -n "$ADMIN_DIGEST"

          test "$API_DIGEST" != "None"
          test "$CUSTOMER_DIGEST" != "None"
          test "$ADMIN_DIGEST" != "None"

          API_REF="$ECR_REGISTRY/$ECR_API_REPOSITORY@$API_DIGEST"
          CUSTOMER_REF="$ECR_REGISTRY/$ECR_CUSTOMER_REPOSITORY@$CUSTOMER_DIGEST"
          ADMIN_REF="$ECR_REGISTRY/$ECR_ADMIN_REPOSITORY@$ADMIN_DIGEST"

          echo "api_digest=$API_REF" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=$CUSTOMER_REF" >> "$GITHUB_OUTPUT"
          echo "admin_digest=$ADMIN_REF" >> "$GITHUB_OUTPUT"

          {
            echo "image_tag=$TAG"
            echo "api_digest=$API_REF"
            echo "frontend_digest=$CUSTOMER_REF"
            echo "admin_digest=$ADMIN_REF"
          } > image-digests.txt

          cat image-digests.txt

      - name: Upload digest manifest
        if: steps.meta.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ steps.meta.outputs.tag }}
          path: image-digests.txt
          if-no-files-found: error
          retention-days: 30

  ci-gate:
    name: CI
    runs-on: ubuntu-latest
    if: always()

    needs:
      - backend-lint
      - backend-unit
      - frontend
      - frontend-admin
      - security-scan
      - migration-test
      - db-consistency
      - integration
      - e2e-playwright
      - docker-build

    steps:
      - name: Require all checks green
        run: |
          results='${{ join(needs.*.result, ',') }}'

          echo "Job results: $results"

          for r in $(echo "$results" | tr ',' ' '); do
            if [ "$r" != "success" ]; then
              echo "CI gate failed - not all jobs succeeded"
              exit 1
            fi
          done

          echo "All required CI jobs succeeded"