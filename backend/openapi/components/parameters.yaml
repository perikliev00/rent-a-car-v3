CarIdPath:
  name: carId
  in: path
  required: true
  description: Car identifier
  schema:
    type: string
    format: uuid

DateFromQuery:
  name: from
  in: query
  required: false
  description: Range start date (inclusive), ISO 8601 date
  schema:
    type: string
    format: date

DateToQuery:
  name: to
  in: query
  required: false
  description: Range end date (inclusive), ISO 8601 date
  schema:
    type: string
    format: date

IdPath:
  name: id
  in: path
  required: true
  description: Resource identifier
  schema:
    type: string

PageQuery:
  name: page
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    default: 1

LimitQuery:
  name: limit
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
