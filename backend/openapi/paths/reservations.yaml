/api/v1/admin/reservations/cancellation-requests/{id}/review:
  post:
    tags: [Reservations]
    summary: Review a cancellation request
    description: |
      Approve or reject a customer cancellation request.
      x-permissions: can_view_reservations_ops (review)
    security:
      - cookieAuth: []
        csrfHeader: []
    parameters:
      - $ref: '#/components/parameters/IdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [decision]
            properties:
              decision:
                type: string
                enum: [approve, reject]
              note:
                type: string
    responses:
      '200':
        description: Review recorded
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSuccessEnvelope'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
