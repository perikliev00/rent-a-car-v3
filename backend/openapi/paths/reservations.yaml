/api/v1/reservations/release:
  post:
    tags: [Reservations]
    summary: Release active reservation hold
    security:
      - cookieAuth: []
        csrfHeader: []
    responses:
      '200':
        description: Hold released
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSuccessEnvelope'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'

/api/v1/reservations/release-and-rehold:
  post:
    tags: [Reservations]
    summary: Release current hold and create a new hold
    security:
      - cookieAuth: []
        csrfHeader: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              carId:
                type: string
                format: uuid
              startDate:
                type: string
                format: date
              endDate:
                type: string
                format: date
    responses:
      '200':
        description: New hold created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSuccessEnvelope'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
      '422':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'

