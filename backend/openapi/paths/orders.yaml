/api/v1/orders:
  post:
    tags: [Orders]
    summary: Create customer order
    security:
      - cookieAuth: []
        csrfHeader: []
      - {}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    responses:
      '200':
        description: Order created
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        order:
                          $ref: '#/components/schemas/Order'
      '401':
        description: Not authenticated (when required)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
      '422':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'

/api/v1/admin/orders:
  get:
    tags: [Orders]
    summary: List admin orders
    description: |
      x-permissions: can_view_orders
    security:
      - cookieAuth: []
    parameters:
      - $ref: '#/components/parameters/PageQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - name: status
        in: query
        schema:
          type: string
    responses:
      '200':
        description: Orders list
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSuccessEnvelope'
      '401':
