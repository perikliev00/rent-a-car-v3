/api/v1/admin/analytics/export.csv:
  get:
    tags: [Analytics]
    summary: Export analytics as CSV
    description: |
      Returns a CSV download.
      x-permissions: can_view_analytics
    security:
      - cookieAuth: []
    parameters:
      - $ref: '#/components/parameters/DateFromQuery'
      - $ref: '#/components/parameters/DateToQuery'
      - name: report
        in: query
        required: false
        schema:
          type: string
          enum: [overview, revenue-by-car, revenue-by-location, utilization]
    responses:
      '200':
        description: CSV export
        content:
          text/csv:
            schema:
              type: string
              format: binary
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
