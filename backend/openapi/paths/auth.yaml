/api/v1/auth/login:
  post:
    tags: [Auth]
    summary: Log in with email and password
    description: >
      Creates a session cookie (`sid`). Subject to rate limiting. Login never assigns
      ownership of reservations or orders; guest bookings are linked only through the
      explicit claim flow. If the account email is not yet confirmed the session is
      limited and `verificationRequired` is true.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                format: password
    responses:
      '200':
        description: Login successful
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        user:
                          $ref: '#/components/schemas/User'
                        verificationRequired:
                          type: boolean
      '401':
        description: Invalid credentials
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
      '422':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
      '429':
        description: Rate limited
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateLimitedError'

/api/v1/auth/signup:
  post:
    tags: [Auth]
    summary: Register a new customer account
    description: >
      Creates a user and a limited session, and mails a confirmation link. Subject to rate
      limiting. Signup never assigns ownership of existing reservations or orders — knowing
      an email address grants nothing.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password, firstName, lastName]
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                format: password
              firstName:
                type: string
              lastName:
                type: string
              phone:
                type: string
    responses:
      '200':
        description: Signup successful
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        user:
                          $ref: '#/components/schemas/User'
                        verificationRequired:
                          type: boolean
      '409':
        description: Email already in use
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
      '422':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
      '429':
        description: Rate limited
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateLimitedError'

/api/v1/auth/verify-email:
  post:
    tags: [Auth]
    summary: Confirm an email address with a verification token
    description: >
      Consumes a single-use verification token that was mailed to the account address.
      Only the SHA-256 hash of the token is stored server-side. Idempotent: replaying a
      link for an already-confirmed account succeeds. Invalid, used and revoked tokens all
      return the same `VERIFICATION_TOKEN_INVALID` response so token existence cannot be
      probed. Subject to rate limiting.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token:
                type: string
                description: 64-character hex verification token from the emailed link.
                pattern: '^[0-9a-fA-F]{64}$'
    responses:
      '200':
        description: Email confirmed
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        emailVerified:
                          type: boolean
                        alreadyVerified:
                          type: boolean
      '400':
        description: Token invalid, already used, or revoked
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
      '410':
        description: Token expired
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
      '422':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
      '429':
        description: Rate limited
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateLimitedError'

/api/v1/auth/verify-email/resend:
  post:
    tags: [Auth]
    summary: Resend the email confirmation link
    description: >
      Issues a new verification token for the signed-in account and revokes the previous
      unused one. The response is uniform whether a mail was sent, throttled by the
      per-account cooldown, or the account was already verified. Subject to rate limiting.
    security:
      - cookieAuth: []
        csrfHeader: []
    responses:
      '200':
        description: Request accepted
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        requested:
                          type: boolean
                        emailVerified:
                          type: boolean
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
      '429':
        description: Rate limited
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateLimitedError'

/api/v1/auth/logout:
  post:
    tags: [Auth]
    summary: End current session
    security:
      - cookieAuth: []
        csrfHeader: []
    responses:
      '200':
        description: Logged out
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSuccessEnvelope'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'

/api/v1/auth/csrf:
  get:
    tags: [Auth]
    summary: Get CSRF token
    description: Returns a CSRF token for use in the `X-CSRF-Token` header on mutating requests.
    security: []
    responses:
      '200':
        description: CSRF token
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        csrfToken:
                          type: string

/api/v1/auth/me:
  get:
    tags: [Auth]
    summary: Current authenticated user
    security:
      - cookieAuth: []
    responses:
      '200':
        description: Current user
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        user:
                          $ref: '#/components/schemas/User'
                        verificationRequired:
                          type: boolean
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
