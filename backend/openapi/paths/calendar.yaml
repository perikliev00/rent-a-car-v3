/api/v1/admin/calendar/events:
  get:
    tags: [Calendar]
    summary: List calendar events in a range
    description: |
      x-permissions: calendar.view or calendar.view_own
    security:
      - cookieAuth: []
    parameters:
      - $ref: '#/components/parameters/DateFromQuery'
      - $ref: '#/components/parameters/DateToQuery'
    responses:
      '200':
        description: Calendar events
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSuccessEnvelope'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'

