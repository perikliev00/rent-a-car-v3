/api/v1/admin/calendar/events/{id}/move:
  patch:
    tags: [Calendar]
    summary: Move calendar event
    description: |
      x-permissions: calendar.move
    security:
      - cookieAuth: []
        csrfHeader: []
    parameters:
      - $ref: '#/components/parameters/IdPath'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              startDate:
                type: string
                format: date
              endDate:
                type: string
                format: date
              carId:
                type: string
                format: uuid
    responses:
      '200':
        description: Event moved
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSuccessEnvelope'
      '401':
        description: Not authenticated
