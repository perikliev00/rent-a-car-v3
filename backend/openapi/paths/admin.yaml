    security:
      - cookieAuth: []
    responses:
      '200':
        description: Dashboard metrics
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSuccessEnvelope'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'

/api/v1/admin/users:
  get:
    tags: [Admin]
    summary: List users
    description: |
      x-permissions: can_manage_users
    security:
      - cookieAuth: []
    parameters:
      - $ref: '#/components/parameters/PageQuery'
      - $ref: '#/components/parameters/LimitQuery'
    responses:
      '200':
        description: Users list
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApiSuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        users:
                          type: array
                          items:
                            $ref: '#/components/schemas/User'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
  post:
    tags: [Admin]
    summary: Create user
    description: |
      x-permissions: can_manage_users
    security:
      - cookieAuth: []
        csrfHeader: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                format: password
              firstName:
                type: string
              lastName:
                type: string
              roleIds:
                type: array
                items:
                  type: string
    responses:
      '200':
        description: User created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiSuccessEnvelope'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'
      '422':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiError'

