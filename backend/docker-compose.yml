# Deprecated: use root-level docker-compose.dev.yml or docker-compose.prod.yml instead.
services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: luxride
      POSTGRES_USER: luxride
      POSTGRES_PASSWORD: luxride
    ports:
      - "5432:5432"
