global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - match:
        alertname: PaidButNotConfirmed
      receiver: critical
      group_wait: 0s
      repeat_interval: 5m
    - match:
        severity: critical
      receiver: critical
      repeat_interval: 15m

receivers:
  - name: default
    webhook_configs:
      - url: 'http://127.0.0.1:65535/disabled'
        send_resolved: true

  - name: critical
    webhook_configs:
      - url: 'http://127.0.0.1:65535/disabled'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname']
