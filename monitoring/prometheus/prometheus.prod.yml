global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: backend
    metrics_path: /prometheus
    authorization:
      type: Bearer
      credentials: __METRICS_TOKEN__
    static_configs:
      - targets: ['backend:3000']

  - job_name: worker
    metrics_path: /prometheus
    authorization:
      type: Bearer
      credentials: __METRICS_TOKEN__
    static_configs:
      - targets: ['worker:3000']
