# Allow only known intentional Stripe-shaped placeholders used in CI/unit tests.
# Real sk_live_ / sk_test_ credentials must still fail the scan.
title = "LuxRide"

[extend]
useDefault = true

[[allowlists]]
description = "Intentional Stripe-shaped CI/test placeholders (not real credentials)"
regexTarget = "secret"
regexes = [
  '''(?i)^sk_(?:live|test)_[a-z0-9_]*placeholder[a-z0-9_]*$''',
  '''sk_test_123456789012345678901234567890''',
  '''sk_live_test123456789012345678901234567890''',
]
